function restrooms(){if(state.selectedRoom){const r=roomsForSite().find(x=>x.id===state.selectedRoom);if(!r)state.selectedRoom=null;else return roomDetail(r)}const matches=roomsForSite().filter(r=>(state.roomFilter==='All'||statusForRoom(r)===state.roomFilter)&&`${r.name} ${r.id} ${r.zone}`.toLowerCase().includes(state.roomSearch.toLowerCase()));return `${heading('Smart Restroom Management','Monitor hygiene, supplies, occupancy and demand across your locations.',`<button class="btn btn-light btn-sm" data-action="simulate">${icon('refresh','sm')} Simulate Update</button>`)}<div class="toolbar"><label class="search-box">${icon('search','sm')}<input id="roomSearch" placeholder="Search restrooms, zones, IDs..." value="${escapeHTML(state.roomSearch)}" /></label><div class="filter-row">${['All','Healthy','Attention'].map(f=>`<button data-room-filter="${f}" class="filter-pill ${state.roomFilter===f?'active':''}">${f}</button>`).join('')}</div></div><div class="room-grid">${matches.map(r=>`<button class="room-card" data-room="${r.id}"><div class="space-between"><span class="room-symbol">${icon('wash','lg')}</span>${statusTag(statusForRoom(r))}</div><h3>${escapeHTML(r.name)}</h3><p>${escapeHTML(r.zone)} · ${escapeHTML(r.id)}</p><div class="room-data"><div><strong>${r.clean}<span style="font-size:12px;color:#9aacb9">/100</span></strong><span>Cleanliness</span></div><div><strong>${shortNum(r.footfall)}</strong><span>Visitor count</span></div></div><div class="space-between" style="margin-bottom:7px"><span class="tiny muted">Soap availability</span><span class="tiny" style="font-weight:800;color:${r.soap<state.thresholds.soap?'#e0585f':'#239f88'}">${r.soap}%</span></div><div class="progress"><span style="width:${r.soap}%;background:${r.soap<state.thresholds.soap?'#e76c70':'#17b59a'}"></span></div><div class="room-bottom" style="margin-top:17px"><span>Last clean · ${escapeHTML(r.last)}</span><span style="color:#16a88e;font-weight:800">View details →</span></div></button>`).join('')||'<div class="panel empty">No matching restrooms found.</div>'}</div>`}
function meter(label,value,low=false,reverse=false){const bad=reverse?value>state.thresholds.bin:low;return `<div class="sensor-item"><div class="sensor-head"><span>${escapeHTML(label)}</span>${tag(bad?'Attention':'Normal',bad?'amber':'green')}</div><div class="number">${value}%</div><div class="progress" style="margin-top:13px"><span style="width:${Math.min(value,100)}%;background:${bad?'#efaa46':'#14b59c'}"></span></div><div class="sub">${reverse?'Estimated bin fill level':'Estimated supply remaining'}</div></div>`}
function roomDetail(r){return `${heading('Restroom Intelligence',`${escapeHTML(r.site)} · ${escapeHTML(r.zone)}`,`<button class="btn btn-light btn-sm" data-action="back-rooms">← All Restrooms</button><button class="btn btn-primary btn-sm" data-action="create-for-room" data-id="${r.id}">${icon('plus','sm')} Create Task</button>`)}<div class="panel panel-inner mb18"><div class="room-detail-head"><div><h2 style="font-size:21px">${escapeHTML(r.name)}</h2><p class="muted" style="margin-top:7px">Sensor cluster ID: ${escapeHTML(r.id)} · Demo feed</p></div>${statusTag(statusForRoom(r))}</div><div class="detail-metrics"><div class="detail-stat"><strong>${r.clean}/100</strong><span>Cleanliness Score</span></div><div class="detail-stat"><strong>${shortNum(r.footfall)}</strong><span>Visitors Today</span></div><div class="detail-stat"><strong>${r.occupancy}/${r.capacity}</strong><span>Stalls Occupied</span></div><div class="detail-stat"><strong>${r.quality}/100</strong><span>Air Quality Index*</span></div></div><div class="alert-box">${icon('activity','lg')}<span><b>Monitoring summary:</b> ${statusForRoom(r)==='Attention'?'At least one reading is outside the configured threshold. Consider a cleaning or refill task.':'Demo sensor values are within the configured attention thresholds.'} Last cleaning recorded at ${escapeHTML(r.last)}. <span class="muted">*Illustrative normalized score, not a measured AQI.</span></span></div></div><div class="grid2"><div class="panel panel-inner"><div class="panel-head"><div><h3 class="panel-title">Consumables and Sensors</h3><p class="panel-sub">Simulated data · refresh with Simulate Update</p></div><button class="btn btn-light btn-sm" data-action="simulate">${icon('refresh','sm')}</button></div><div class="sensor-grid">${meter('Soap dispenser',r.soap,r.soap<state.thresholds.soap)}${meter('Paper towels',r.tissue,r.tissue<state.thresholds.tissue)}${meter('Toilet paper',r.paper,r.paper<state.thresholds.paper)}${meter('Waste bin',r.bin,false,true)}</ function workorders(){const tasks=tasksForSite().filter(t=>state.taskFilter==='All'||t.status===state.taskFilter);return `${heading('Work Order Management','Create, assign and track cleaning and maintenance requests.',`<button class="btn btn-light btn-sm" data-action="csv-tasks">${icon('download','sm')} Export CSV</button><button class="btn btn-primary btn-sm" data-action="open-create">${icon('plus','sm')} Create Work Order</button>`)}<div class="kpi-grid">${kpi('Total Work Orders',tasksForSite().length,'clipboard','In the selected facilities','blue')}${kpi('Open',tasksForSite().filter(t=>t.status==='Open').length,'clock','Awaiting assignment or start','orange')}${kpi('In Progress',tasksForSite().filter(t=>t.status==='In Progress').length,'activity','Being serviced now','purple')}${kpi('Completed',tasksForSite().filter(t=>t.status==='Completed').length,'checkCircle','Recorded in this demo','')}</div><div class="toolbar"><div class="filter-row">${['All','Open','In Progress','Completed'].map(f=>`<button class="filter-pill ${state.taskFilter===f?'active':''}" data-task-filter="${f}">${f}</button>`).join('')}</div><span class="muted tiny">Change a status using the dropdown in each row.</span></div><div class="panel"><div class="table-container"><table class="table"><thead><tr><th>Work Order</th><th>Restroom</th><th>Assigned To</th><th>Priority</th><th>Created</th><th>Status</th></tr></thead><tbody>${tasks.map(t=>`<tr><td><strong>${escapeHTML(t.title)}</strong><br/><span class="muted tiny">${escapeHTML(t.id)}</span></td><td><strong>${escapeHTML(t.room)}</strong><br/><span class="muted tiny">${escapeHTML(t.site)}</span></td><td>${escapeHTML(t.assignee)}</td><td>${statusTag(t.priority)}</td><td>${escapeHTML(t.created)}</td><td><select class="small-select" data-task-status="${escapeHTML(t.id)}" aria-label="Change status of ${escapeHTML(t.id)}">${['Open','In Progress','Completed'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).jo function workforce(){const people=staffForSite();return `${heading('Workforce Operations','Monitor shift allocations and work-order throughput by employee.',`<button class="btn btn-primary btn-sm" data-action="open-create">${icon('plus','sm')} Assign Task</button>`)}<div class="kpi-grid">${kpi('Team Members',people.length,'users','On selected properties','blue')}${kpi('On Duty',people.filter(s=>s.status==='On duty').length,'checkCircle','Simulated shift information','')}${kpi('Tasks Assigned',people.reduce((a,s)=>a+s.tasks,0),'clipboard','Illustrative daily workload','purple')}${kpi('Tasks Completed',people.reduce((a,s)=>a+s.done,0),'target','Illustrative shift completions','orange')}</div><div class="workforce-grid">${people.map(s=>`<div class="staff-card"><div class="staff-top"><span class="staff-avatar">${s.initial}</span><div style="flex:1"><h3 style="font-size:14px">${escapeHTML(s.name)}</h3><p class="staff-role">${escapeHTML(s.role)}</p></div>${statusTag(s.status)}</div><div class="staff-stat"><span>${escapeHTML(s.shift)}</span></div><div class="staff-stat"><span>Daily Task Completion</span><strong>${s.done}/${s.tasks} tasks</strong></div><div class="progress"><span style="width:${Math.round(s.done/s.tasks*100)}%"></span></div><p style="margin-top:13px;color:#8293a3;font-size:11px">${escapeHTML(s.site)}</p></div>`).join('')||'<div class="panel empty">No staff members found at this property.</div>'}</div><p class="site-footnote">Workforce schedule and completion metrics are illustrative. New work orders are saved separately and do not affect mock shift metrics.</p>`}
function insights(){const rooms=roomsForSite(),tasks=tasksForSite();const avg=Math.round(rooms.reduce((a,r)=>a+r.clean,0)/(rooms.length||1));const footfall=rooms.reduce((a,r)=>a+r.footfall,0);const alerts=highPriorityRooms();let recommendations=[];if(alerts.length)recommendations.push({title:`Prioritize ${alerts[0].name}`,description:`Cleaning score ${alerts[0].clean}/100 with soap at ${alerts[0].soap}% and tissue at ${alerts[0].tissue}%. Dispatch a team to assess and replenish supplies.`,ic:'alert',color:'amber'});const lowSoap=rooms.filter(r=>r.soap<state.thresholds.soap);if(lowSoap.length)recommendations.push({title:'Replenish low soap dispensers',description:`${lowSoap.length} restroom(s) fall below your configured ${state.thresholds.soap}% soap threshold.`,ic:'droplet',color:'amber'});const highTraffic=[...rooms].sort((a,b)=>b.footfall-a.footfall)[0];if(highTraffic)recommendations.push({title:'Adjust cleaning based on demand',description:`${highTraffic.name} has the highest simulated usage (${highTraffic.footfall} visits). Consider an additional inspection during peak hours.`,ic:'trend',color:'blue'});if(tasks.some(t=>t.status==='Open'))recommendations.push({title:'Review outstanding work orders',description:`${tasks.filter(t=>t.status==='Open').length} orders remain open for the current facility selection. Assign or start priority items.`,ic:'clipboard',color:'blue'});return `${heading('Analytics & Insights','Make confident operational decisions with sample telemetry and task analytics.',`<button class="btn btn-light btn-sm" data-action="csv-rooms">${icon('download','sm')} Export Sensor Data</button>`)}<div class="kpi-grid">${kpi('Visitor Traffic',shortNum(footfall),'users','Cumulative mock entries','blue')}${kpi('Average Cleanliness',`${avg}/100`,'checkCircle','Across selected restrooms','')}${kpi('Active Alerts',alerts.length,'alert','Threshold-triggered','orange')}${kpi('Task Completion',`${tasks.length?Math.round(tasks.filter(t=>t.status==='Completed').length/tasks.length*100):100}%`,'chart','Current work orders','purple')}</div><div class="overview-grid"><div class="panel panel-inner"><div class="panel-head"><div><h3 class="panel-title">Traffic by Time of Day</h3><p class="panel-sub">Illustrative facility utilization pattern</p></div>${tag('Demo Model','gray')}</div>${trafficChart()}</div><div class="panel panel-inner"><div class="panel-head"><div><h3 class="panel-title">Cleanliness by Zone</h3><p class="panel-sub">Current simulated cleanliness scores</p></div></div>${rooms.slice(0,5).map(r=>`<div style="margin-bottom:15px"><div class="space-between" style="margin-bottom:7px"><span style="font-size:11px;font-weight:700">${escapeHTML(r.name)}</span><b style="font-size:12px">${r.clean}/100</b></div><div class="progress"><span style="width:${r.clean}%;background:${r.clean<state.thresholds.clean?'#efa34b':'#12b49a'}"></span></div></div>`).join('')}</div></div><div class="panel panel-inner"><div class="panel-head"><div><h3 class="panel-title">Recommended Actions</h3><p class="panel-sub">Rule-based demo insights; AI integration can be added later</p></div>${icon('spark','lg')}</div><div class="insight-list">${recommendations.map((r,i)=>`<div class="insight"><span class="kpi-icon ${r.color==='amber'?'orange':'blue'}">${icon(r.ic)}</span><div style="flex:1"><h4>${i+1}. ${escapeHTML(r.title)}</h4><p>${escapeHTML(r.description)}</p></div></div>`).join('')||'<div class="empty">No recommendations triggered by current demo thresholds.</div>'}</div></div>`}
function answerQuestion(question){const q=question.toLowerCase(),rooms=roomsForSite(),tasks=tasksForSite(),alerts=highPriorityRooms();if(/(soap|tissue|paper|supply|supplies|refill)/.test(q)){const low=rooms.filter(r=>r.soap<state.thresholds.soap||r.tissue<state.thresholds.tissue||r.paper<state.thresholds.paper);return low.length?`I found ${low.length} restroom(s) with low supplies in the selected properties:\n${low.map(r=>`• ${r.name}: soap ${r.soap}%, tissue ${r.tissue}%, toilet paper ${r.paper}%`).join('\n')}\n\nSuggestion: create refill work orders for these locations.`:'All selected restrooms have consumables above your configured low-supply thresholds.'}
if(/(priority|urgent|alert|attention|clean)/.test(q)){return alerts.length?`There are ${alerts.length} restrooms needing attention. Top priorities:\n${alerts.slice(0,4).map((r,i)=>`${i+1}. ${r.name} — cleanliness ${r.clean}/100, priority index ${getUrgency(r)}`).join('\n')}\n\nThis is a threshold-based ranking, not an AI prediction.`:'All selected restrooms are currently within your demo attention thresholds.'}
if(/(task|order|completed|pending|open)/.test(q))return `Work-order summary for ${state.site}:\n• Open: ${tasks.filter(t=>t.status==='Open').length}\n• In progress: ${tasks.filter(t=>t.status==='In Progress').length}\n• Completed: ${tasks.filter(t=>t.status==='Completed').length}\n\nYou can create or update tasks in Work Orders.`;
if(/(staff|worker|workforce|team|janitor|shift)/.test(q)){const list=staffForSite();return `There are ${list.length} demo staff records for ${state.site}. ${list.filter(s=>s.status==='On duty').length} are marked on duty.\n${list.map(s=>`• ${s.name} — ${s.role} (${s.status})`).join('\n')}`}
if(/(occup|traffic|visitor|footfall|busy)/.test(q)){const top=[...rooms].sort((a,b)=>b.footfall-a.footfall)[0];return `The selected restrooms show ${shortNum(rooms.reduce((sum,r)=>sum+r.footfall,0))} simulated visitor entries. The busiest is ${top?.name||'N/A'} with ${top?.footfall||0} visits. Hourly traffic figures in Analytics are illustrative.`}
return `I can help summarize simulated restroom alerts, low supplies, work orders, staff or traffic for ${state.site}. Try “Which restrooms need attention?” or “Show open tasks.” This is a rules-based assistant demo; no external LLM is connected.`}
function assistant(){return `${heading('Operations Assistant','Ask questions about your facility — powered by local demo rules.',`${tag('Rules-based Demo','blue')}`)}<div class="assistant-layout"><div class="panel chat-box"><div class="panel-head" style="margin:0;padding:19px 22px;border-bottom:1px solid #e8eef2"><div class="row-flex"><span class="kpi-icon">${icon('bot')}</span><div><h3 class="panel-title">Infinity Operations Assistant</h3><p class="panel-sub">Demo mode · No external AI connected</p></div></div>${tag('Available','green')}</div><div class="chat-stream" id="chatStream">${state.chat.map(m=>`<div class="chat-bubble ${m.role==='bot'?'bot':'me'}">${escapeHTML(m.message)}</div>`).join('')}</div><form class="chat-input" id="chatForm"><input class="form-control" id="chatText" placeholder="Ask about alerts, supplies, cleaning or staff..." maxlength="400" autocomplete="off" required/><button type="submit" class="btn btn-primary" aria-label="Send message">${icon('send')}</button></form></div><div class="panel panel-inner"><div class="panel-head"><div><h3 class="panel-title">Quick Questions</h3><p class="panel-sub">Click to explore the demo</p></div>${icon('spark')}</div><div class="suggestions">${['Which restrooms need attention?','Show low soap and tissue supplies','How many work orders are open?','Who is on duty today?','Which restroom has highest traffic?'].map(q=>`<button class="suggestion" data-ask="${escapeHTML(q)}">${icon('chevron','sm')} ${escapeHTML(q)}</button>`).join('')}</div><div class="alert-box">${icon('alert','sm')} <span>Responses come from a small set of local rules and your demo data. They are not predictions or generated by a real AI model.</span></div></div></div>`}
function modal(){if(state.modal!=='create')return '';const chosen=state.selectedRoom&&roomsForSite().some(r=>r.id===state.selectedRoom)?state.selectedRoom:'';return `<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalHeading"><div class="modal-title"><h2 id="modalHeading">Create Work Order</h2><button class="icon-button" data-action="close-modal" aria-label="Close modal">${icon('close')}</button></div><form id="createTaskForm"><div class="form-group"><label class="form-label" for="taskTitle">Task description</label><input required class="form-control" id="taskTitle" maxlength="110" placeholder="e.g. Refill paper towels" /></div><div class="grid2"><div class="form-group"><label class="form-label" for="taskRoom">Restroom</label><select required class="form-control" id="taskRoom">${roomsForSite().map(r=>`<option ${chosen===r.id?'selected':''} value="${r.id}">${escapeHTML(r.name)} (${r.id})</option>`).join('')}</select></div><div class="form-group"><label class="form-label" for="taskPriority">Priority</label><select class="form-control" id="taskPriority"><option>Normal</option><option selected>High</option><option>Critical</option></select></div></div><div class="form-group"><label class="form-label" for="taskAssignee">Assign to</label><select class="form-control" id="taskAssignee">${staff.map(s=>`<option value="${escapeHTML(s.name)}">${escapeHTML(s.name)} (${escapeHTML(s.role)})</option>`).join('')}</select></div><div class="divider" style="margin:19px 0"></div><div class="space-between"><button type="button" class="btn btn-light" data-action="close-modal">Cancel</button><button type="submit" class="btn btn-primary">${icon('plus','sm')} Create Task</button></div></form></div></div>`}
function updateROI(){const staff=Number($('#roiStaff')?.value||35),rate=Number($('#roiCost')?.value||150),gain=Number($('#roiGain')?.value||12);const hours=staff*8*300*gain/100,savings=Math.round(hours*rate),fmt=n=>'₹'+new Intl.NumberFormat('en-IN',{maximumFractionDigits:0}).format(n);for(const [id,val] of [['roiStaffLabel',String(staff)],['roiCostLabel',fmt(rate)],['roiGainLabel',gain+'%'],['roiAnnual',fmt(savings)],['roiMonthly',fmt(Math.round(savings/12))],['roiHours',new Intl.NumberFormat('en-IN').format(Math.round(hours))+' hrs']]){const el=$('#'+id);if(el)el.textContent=val}}
function render(){const r=route(),root=$('#root');if(!root)return;document.title=`${r==='landing'?'Intelligent Facility Operations':navItems.find(x=>x[0]===r)?.[2]||'Command Center'} | Infinity Automation`;root.innerHTML=r==='landing'?landing():shell(r,({overview,restrooms,workorders,workforce,insights,assistant}[r]||overview)());if(r==='assistant'){const stream=$('#chatStream');if(stream)stream.scrollTop=stream.scrollHeight}if(r==='landing')updateROI()}
function csvDownload(filename,rows){if(!rows.length){toast('No data to export');return}const headers=Object.keys(rows[0]);const text=[headers,...rows.map(o=>headers.map(h=>o[h]))].map(row=>row.map(value=>`"${String(value??'').replaceAll('"','""')}"`).join(',')).join('\r\n');const blob=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function ask(question){const clean=String(question||'').trim();if(!clean)return;state.chat.push({role:'me',message:clean},{role:'bot',message:answerQuestion(clean)});render()}
function simulate(){state.simulations++;state.rooms.forEach((r,i)=>{const shift=(state.simulations+i)%5-2;r.footfall+=Math.max(1,3+i%6);r.occupancy=Math.max(0,Math.min(r.capacity,r.occupancy+(shift>0?1:shift<0?-1:0)));r.soap=Math.max(4,r.soap-(i%3===0?2:1));r.bin=Math.min(99,r.bin+((i+state.simulations)%3===0?2:1));r.clean=Math.max(48,r.clean-(i%2));});render();toast('Demo sensor data refreshed (simulation only)')}
function createTask(){const title=$('#taskTitle')?.value.trim(),roomId=$('#taskRoom')?.value,priority=$('#taskPriority')?.value,assignee=$('#taskAssignee')?.value,room=state.rooms.find(r=>r.id===roomId);if(!title||!room){toast('Please enter a task and choose a restroom');return}const numeric=Math.max(1006,...state.tasks.map(t=>Number(String(t.id).replace('WO-',''))||0))+1;state.tasks.unshift({id:`WO-${numeric}`,title:title.slice(0,110),room:room.id,site:room.site,assignee:assignee||'Unassigned',priority:priority||'Normal',status:'Open',created:'Today, '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true})});state.modal=null;state.selectedRoom=null;persist();go('workorders');toast('Work order created and saved in this browser')}
window.addEventListener('hashchange',()=>{state.selectedRoom=null;render()});
document.addEventListener('click',async(e)=>{const p=e.target.closest('[data-page]');if(p){e.preventDefault();go(p.dataset.page);return}const filter=e.target.closest('[data-room-filter]');if(filter){state.roomFilter=filter.dataset.roomFilter;render();return}const taskFilter=e.target.closest('[data-task-filter]');if(taskFilter){state.taskFilter=taskFilter.dataset.taskFilter;render();return}const room=e.target.closest('[data-room]');if(room){state.selectedRoom=room.dataset.room;render();window.scrollTo(0,0);return}const question=e.target.closest('[data-ask]');if(question){ask(question.dataset.ask);return}const action=e.target.closest('[data-action]')?.dataset.action;if(!action){if(e.target.id==='modalBackdrop'){state.modal=null;render()}return}switch(action){case 'mobile':state.mobile=!state.mobile;render();break;case 'notifications':state.notifications=!state.notifications;render();break;case 'simulate':simulate();break;case 'open-create':state.modal='create';render();break;case 'create-for-room':state.selectedRoom=e.target.closest('[data-id]')?.dataset.id||state.selectedRoom;state.modal='create';render();break;case 'close-modal':state.modal=null;render();break;case 'back-rooms':state.selectedRoom=null;render();break;case 'csv-tasks':csvDownload('infinity-automation-workorders.csv',tasksForSite());toast('Work orders exported');break;case 'csv-rooms':csvDownload('infinity-automation-sensors.csv',roomsForSite().map(r=>({...r,status:statusForRoom(r)})));toast('Sensor demo data exported');break;}});
document.addEventListener('change',(e)=>{if(e.target.id==='siteSelect'){state.site=e.target.value;if(!SITES.includes(state.site))state.site=SITES[0];state.selectedRoom=null;persist();render()}else if(e.target.matches('[data-task-status]')){const task=state.tasks.find(t=>t.id===e.target.dataset.taskStatus);if(task){task.status=e.target.value;persist();render();toast(`${task.id} updated to ${task.status}`)}}});
document.addEventListener('input',(e)=>{if(e.target.matches('[data-roi]')){updateROI();return}if(e.target.id==='roomSearch'){const caret=e.target.selectionStart;state.roomSearch=e.target.value;const grid=$('.room-grid');if(grid){const matches=roomsForSite().filter(r=>(state.roomFilter==='All'||statusForRoom(r)===state.roomFilter)&&`${r.name} ${r.id} ${r.zone}`.toLowerCase().includes(state.roomSearch.toLowerCase()));grid.innerHTML=matches.map(r=>`<button class="room-card" data-room="${r.id}"><div class="space-between"><span class="room-symbol">${icon('wash','lg')}</span>${statusTag(statusForRoom(r))}</div><h3>${escapeHTML(r.name)}</h3><p>${escapeHTML(r.zone)} · ${escapeHTML(r.id)}</p><div class="room-data"><div><strong>${r.clean}/100</strong><span>Cleanliness</span></div><div><strong>${r.footfall}</strong><span>Visitor count</span></div></div><div class="progress"><span style="width:${r.soap}%"></span></div><div class="room-bottom" style="margin-top:17px"><span>Soap ${r.soap}%</span><span style="color:#16a88e;font-weight:800">View details →</span></div></button>`).join('')||'<div class="panel empty">No matching restrooms found.</div>';}if(caret!==null)e.target.setSelectionRange(caret,caret)}});
document.addEventListener('submit',(e)=>{if(e.target.id==='createTaskForm'){e.preventDefault();createTask()}if(e.target.id==='chatForm'){e.preventDefault();const text=$('#chatText')?.value;ask(text)}});
document.addEventListener('keydown',(e)=>{if(e.key==='Escape'&&(state.modal||state.notifications||state.mobile)){state.modal=null;state.notifications=false;state.mobile=false;render()}});
render();
</script></body></html>
